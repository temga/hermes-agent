name: Build Hermes Setup (Bifrost Tauri installer)

on:
  push:
    tags:
      - 'v*-bifrost-setup.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-tauri-bifrost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout (manual clone — no actions/* downloads)
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || github.ref }}"
          REF_NAME="${REF#refs/heads/}"
          REF_NAME="${REF_NAME#refs/tags/}"
          echo "Cloning ref: $REF_NAME"
          # Self-hosted runner workspace may have leftovers from previous runs.
          find . -mindepth 1 -delete 2>/dev/null || true
          git clone --depth 1 --branch "$REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .

      - name: Install Rust toolchain (if missing)
        run: |
          if ! command -v rustc &>/dev/null; then
            echo "Rust not found — installing via rustup..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            echo "Rust already installed: $(rustc --version)"
          fi

      - name: Verify Rust toolchain
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustc --version
          cargo --version
          echo "Rust toolchain OK"

      - name: Verify Node version
        run: |
          node --version
          npm --version
          NODE_MAJOR=$(node -e "console.log(process.versions.node.split('.')[0])")
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "::error::Node 20+ required, got $(node --version)"
            exit 1
          fi
          echo "✓ Node $NODE_MAJOR OK"

      - name: Install bootstrap-installer deps
        run: |
          cd apps/bootstrap-installer
          npm ci

      - name: Build frontend
        run: |
          cd apps/bootstrap-installer
          npm run build

      - name: Build Tauri DMG (signed + notarized)
        run: |
          cd apps/bootstrap-installer
          # Pin to the EXACT commit SHA — immutable URL avoids GitHub raw cache staleness.
          export HERMES_BUILD_PIN_COMMIT="$GITHUB_SHA"
          export HERMES_BUILD_PIN_BRANCH="bifrost-edition"
          echo "Pinning installer to commit $HERMES_BUILD_PIN_COMMIT on branch $HERMES_BUILD_PIN_BRANCH"

          # Tauri's notarization uses:
          #   APPLE_API_KEY  = the Key ID (used in JWT header 'kid')
          #   APPLE_API_KEY_PATH = path to the .p8 private key file on disk
          #   APPLE_API_ISSUER = Issuer ID (used in JWT header 'iss')
          # The .p8 content is stored as base64 in the APPLE_API_KEY secret.
          # We decode it to a temp file and set APPLE_API_KEY to the Key ID.
          API_KEY_DIR="$RUNNER_TEMP/apple_api_key"
          mkdir -p "$API_KEY_DIR"
          API_KEY_FILE="$API_KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_B64" | base64 -d > "$API_KEY_FILE"
          echo "API key written to: $API_KEY_FILE"
          ls -la "$API_KEY_FILE"

          export APPLE_API_KEY_PATH="$API_KEY_FILE"
          export APPLE_API_KEY="$APPLE_API_KEY_ID"

          npm run tauri:build
        env:
          TAURI_ENV_PLATFORM: darwin
          # Code signing — Apple Developer ID Application certificate (base64 .p12).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarization — App Store Connect API key.
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Find and rename DMG
        id: find_dmg
        run: |
          DMG=$(find apps/bootstrap-installer/src-tauri/target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found"
            find apps/bootstrap-installer/src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          RENAMED="apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/Hermes-Setup-Bifrost.dmg"
          cp "$DMG" "$RENAMED"
          echo "dmg_path=$RENAMED" >> "$GITHUB_OUTPUT"
          echo "Found: $DMG → $RENAMED"
          ls -lh "$RENAMED"
          # Verify signature
          echo "=== Signature verification ==="
          codesign -dv --verbose=4 "$RENAMED" 2>&1 || true

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          DMG="${{ steps.find_dmg.outputs.dmg_path }}"

          BODY='## Hermes Setup — Bifrost Edition (Tauri installer, ~7MB)

          Lightweight Tauri installer that downloads and installs Hermes Agent + Bifrost Gateway plugins on first launch.
          One key (sk-bf-*) powers LLM, image gen, web search, STT & TTS.

          ### macOS
          1. Download `Hermes-Setup-Bifrost.dmg`
          2. Open, drag Hermes to Applications
          3. Launch — installer will download Hermes Agent + Bifrost plugins automatically
          4. On first launch of the desktop app, enter your Bifrost key (sk-bf-*)
          5. No Gatekeeper warnings — signed with Developer ID + notarized by Apple

          ### Windows
          1. Download `Hermes-Setup-Bifrost.exe`
          2. Run — SmartScreen may warn (unsigned installer); click "More info" → "Run anyway"
          3. Installer will download Hermes Agent + Bifrost plugins automatically
          4. On first launch of the desktop app, enter your Bifrost key (sk-bf-*)

          ### What it does
          - macOS: downloads `install.sh` from `temga/hermes-agent`
          - Windows: runs `install.ps1` (bundled in the installer)
          - Stages: prerequisites → repository → venv → python-deps → node-deps → path → config → **bifrost-plugins** → setup → gateway → desktop → complete
          - `bifrost-plugins` stage: clones `temga/hermes-plugin-bifrost-gateway`, copies 5 plugins to `~/.hermes/plugins/`, configures all service providers → bifrost'

          # Try to create the release; if it already exists (race with Windows job), upload instead.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes Bifrost Edition — $TAG" \
            --notes "$BODY" \
            "$DMG" || \
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$DMG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install bootstrap-installer deps
        shell: bash
        run: |
          cd apps/bootstrap-installer
          npm ci

      - name: Build frontend
        shell: bash
        run: |
          cd apps/bootstrap-installer
          npm run build

      - name: Build Tauri NSIS installer
        shell: bash
        run: |
          cd apps/bootstrap-installer
          export HERMES_BUILD_PIN_COMMIT="$GITHUB_SHA"
          export HERMES_BUILD_PIN_BRANCH="bifrost-edition"
          echo "Pinning installer to commit $HERMES_BUILD_PIN_COMMIT on branch $HERMES_BUILD_PIN_BRANCH"
          npm run tauri:build
        env:
          TAURI_ENV_PLATFORM: windows

      - name: Find and rename NSIS installer
        id: find_exe
        shell: bash
        run: |
          EXE=$(find apps/bootstrap-installer/src-tauri/target/release/bundle/nsis -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "ERROR: No NSIS installer found"
            find apps/bootstrap-installer/src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          RENAMED="apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/Hermes-Setup-Bifrost.exe"
          cp "$EXE" "$RENAMED"
          echo "exe_path=$RENAMED" >> "$GITHUB_OUTPUT"
          echo "Found: $EXE → $RENAMED"
          ls -lh "$RENAMED"

      - name: Upload EXE to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          EXE="${{ steps.find_exe.outputs.exe_path }}"

          # Try to create the release; if it already exists (race with Mac job), upload instead.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes Bifrost Edition — $TAG" \
            --notes "Hermes Setup — Bifrost Edition (Tauri installer)" \
            "$EXE" || \
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$EXE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
