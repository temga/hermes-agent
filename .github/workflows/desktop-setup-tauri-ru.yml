name: Build Hermes Setup (RU Tauri installer)

"on":
  push:
    tags:
      - 'v*-ru-setup.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain (if missing)
        run: |
          if ! command -v rustc &>/dev/null; then
            echo "Rust not found — installing via rustup..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source "$HOME/.cargo/env"
            # Add to PATH for subsequent steps
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            echo "Rust already installed: $(rustc --version)"
          fi

      - name: Verify Rust toolchain
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustc --version
          cargo --version
          echo "Rust toolchain OK"

      - name: Verify Node version
        run: |
          NODE_MAJOR=$(node --version | sed 's/v\([0-9]*\)\..*/\1/')
          echo "Node: $(node --version) (major: $NODE_MAJOR)"
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "ERROR: Node 20+ required, got $(node --version)"
            exit 1
          fi

      - name: Install bootstrap-installer deps
        run: |
          cd apps/bootstrap-installer
          npm ci

      - name: Build frontend
        run: |
          cd apps/bootstrap-installer
          npm run build

      - name: Build Tauri DMG
        run: |
          cd apps/bootstrap-installer
          # Pin to current branch (main) so the installer downloads install.sh
          # from temga/hermes-agent main branch
          export HERMES_BUILD_PIN_BRANCH="main"
          npm run tauri:build
        env:
          # Tauri needs to know the app is not in dev mode
          TAURI_ENV_PLATFORM: darwin

      - name: Find and rename DMG
        id: find_dmg
        run: |
          DMG=$(find apps/bootstrap-installer/src-tauri/target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found"
            find apps/bootstrap-installer/src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          # Rename to a clean name for the release
          RENAMED="apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/Hermes-Setup-RU.dmg"
          cp "$DMG" "$RENAMED"
          echo "dmg_path=$RENAMED" >> "$GITHUB_OUTPUT"
          echo "Found: $DMG → $RENAMED"

      - name: Upload DMG artifact (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hermes-setup-ru-dmg
          path: ${{ steps.find_dmg.outputs.dmg_path }}
          retention-days: 7

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v') && always()
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_dmg.outputs.dmg_path }}
          draft: true
          name: ${{ github.ref_name }}
          body: |
            ## Hermes Setup — RU Edition (Tauri installer, ~11MB)

            Tauri-based installer that downloads and installs Hermes Agent + RU plugins on first launch.

            ### Install
            1. Download Hermes-Setup-RU.dmg
            2. Open, drag Hermes to Applications
            3. `xattr -cr /Applications/Hermes.app`
            4. Launch — installer will download Hermes Agent + RU plugins automatically

            ### What it does
            - Downloads `install.sh` from `temga/hermes-agent`
            - Runs stages: prerequisites → repository → venv → python-deps → node-deps → path → config → **ru-plugins** → setup → gateway → desktop → complete
            - `ru-plugins` stage: clones `temga/hermes-ru-ecosystem`, copies plugins to `~/.hermes/plugins/`
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
