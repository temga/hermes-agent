name: Mirror pinned PM inputs to the fork release

# Bifrost edition: PM downloads pinned binaries (ffmpeg, node, python, ...) from the fork's
# pm-mirror release first, because Russian networks reach GitHub but not always the upstream
# hosts, and the Nous mirror's Cloudflare refuses them. Every lockfile change must land its new
# digests there before clients install it; a digest the release lacks only costs a quick 404.

on:
  push:
    branches: [main, bifrost-next]
    paths:
      - 'pm/lock.json'
      - 'pm/termux_runtime_libs.json'
      - 'pm/artifact_mirror.py'
      - 'pm/wheel_mirror.py'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'scripts/bifrost/mirror_wheels.py'
      - 'scripts/bifrost/mirror_pm_inputs.py'
      - '.github/workflows/bifrost-pm-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bifrost-pm-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      # Runner Python, like archive-inputs.yml: the script needs only PM's stdlib downloader.
      - name: Upload missing pinned inputs
        run: python3 scripts/bifrost/mirror_pm_inputs.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PM retries a sync that failed on PyPI's CDN from the pip-mirror release (pm/wheel_mirror.py).
      # uv is only used to list the default closure; the version is the one pm/lock.json pins.
      - name: Sync the wheel mirror
        run: |
          python3 -m pip install uv==0.13.5
          python3 scripts/bifrost/mirror_wheels.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
