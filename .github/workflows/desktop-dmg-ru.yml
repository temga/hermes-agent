name: Build Desktop DMG (RU)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-dmg-ru-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: macOS DMG (RU plugins bundled)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install root deps
        run: npm install --workspaces=false

      - name: Install desktop workspace deps
        run: npm install --workspace apps/desktop

      - name: Verify RU plugins are bundled
        run: |
          if [ ! -d apps/desktop/resources/ru-plugins/model-providers ]; then
            echo "::error::RU plugins submodule not initialized — check .gitmodules"
            exit 1
          fi
          echo "✓ RU plugins present:"
          find apps/desktop/resources/ru-plugins -name plugin.yaml -maxdepth 3 | sort

      - name: Build desktop app (DMG)
        working-directory: apps/desktop
        run: npm run dist:mac:dmg
        env:
          # Skip code signing + notarization for community builds.
          # Users get an unsigned DMG — macOS Gatekeeper will warn on first
          # launch ("Hermes can't be opened because it is from an
          # unidentified developer"). Right-click → Open bypasses it.
          # For signed builds, set CSC_LINK, CSC_KEY_PASSWORD, and Apple
          # notarization credentials (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
          # APPLE_TEAM_ID) as repository secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder reads these; empty/false skips notarize.mjs.
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-RU-macOS-dmg
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.dmg
          draft: true
          name: ${{ github.ref_name }}
          body: |
            ## Hermes Desktop — RU Edition

            Bundled with Russian ecosystem plugins:
            - RouterAI (model-provider + image generation)
            - NeuralDeep (model-provider + web search)
            - MAX Messenger (platform)

            ### Install
            1. Download the `.dmg`
            2. Open it, drag **Hermes** to Applications
            3. Right-click → Open (Gatekeeper warning — unsigned build)
            4. First launch installs Hermes Agent + copies RU plugins automatically

            ### Requirements
            - macOS 12+
            - Internet connection (first launch downloads Hermes Agent core)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
