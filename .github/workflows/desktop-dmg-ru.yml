name: Build Desktop DMG (RU)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-dmg-ru-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: macOS DMG (RU plugins bundled)
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout (manual clone — bypasses actions/checkout 429 rate limit)
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || github.ref }}"
          # Strip refs/heads/ or refs/tags/ prefix for clone depth.
          REF_NAME="${REF#refs/heads/}"
          REF_NAME="${REF_NAME#refs/tags/}"
          echo "Cloning ref: $REF_NAME"
          git clone --depth 1 --branch "$REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git submodule update --init --recursive --depth 1

      - name: Verify Node version
        run: |
          node --version
          npm --version
          # Node 22+ is required (engines field in package.json).
          # Extract major version and check >=22.
          NODE_MAJOR=$(node -e "console.log(process.versions.node.split('.')[0])")
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "::error::Node >=22 required (found $NODE_MAJOR). Install via nvm: nvm install 22"
            exit 1
          fi
          echo "✓ Node $NODE_MAJOR OK"

      - name: Install root deps
        run: npm install --workspaces=false

      - name: Install desktop workspace deps
        run: npm install --workspace apps/desktop

      - name: Verify RU plugins are bundled
        run: |
          if [ ! -d apps/desktop/resources/ru-plugins/model-providers ]; then
            echo "::error::RU plugins submodule not initialized — check .gitmodules"
            exit 1
          fi
          echo "✓ RU plugins present:"
          find apps/desktop/resources/ru-plugins -name plugin.yaml -maxdepth 3 | sort

      - name: Build desktop app (DMG + adhoc zip)
        working-directory: apps/desktop
        run: npm run dist:mac:dmg
        env:
          # Build unsigned from electron-builder (CSC_IDENTITY_AUTO_DISCOVERY=false).
          # Adhoc signing is done explicitly in the next step with codesign --sign -.
          # This matches Xcode's "Signing Certificate: Sign to Run Locally".
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # No notarization credentials → notarize.mjs skips gracefully.
          APPLE_NOTARY_PROFILE: ''
          APPLE_API_KEY: ''
          APPLE_API_KEY_ID: ''
          APPLE_API_ISSUER: ''

      - name: Adhoc-sign .app, archive zip, verify
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          # Find the .app produced by electron-builder (inside mac-arm64 or mac dir).
          APP=$(find release -name "Hermes.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Hermes.app not found in release/"
            ls -la release/
            exit 1
          fi
          echo "Found app bundle: $APP"

          # Re-sign adhoc with hardened runtime + entitlements (idempotent).
          # electron-builder may have signed with "-" already, but we re-sign
          # explicitly to guarantee the signature is fresh and deep.
          codesign --force --deep --sign - \
            --entitlements electron/entitlements.mac.plist \
            --options runtime \
            "$APP"

          # Archive with ditto (preserves bundle structure + resource fork).
          APP_DIR=$(dirname "$APP")
          ditto -c -k --keepParent "$APP" "$APP_DIR/Hermes.zip"
          echo "Archived to: $APP_DIR/Hermes.zip"

          # Verify signature is adhoc.
          echo "=== codesign --verify --deep --strict ==="
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo
          echo "=== codesign -dv (signature details) ==="
          codesign -dv --verbose=4 "$APP"
          echo
          echo "=== spctl assessment (should FAIL — adhoc, not notarized) ==="
          spctl --assess --verbose=4 "$APP" 2>&1 || true

      - name: Upload DMG artifact (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-RU-macOS-dmg
          path: apps/desktop/release/*.dmg
          if-no-files-found: warn

      - name: Upload adhoc-signed zip artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-RU-macOS-adhoc-zip
          path: apps/desktop/release/**/Hermes.zip
          if-no-files-found: warn

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v') && always()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/**/Hermes.zip
          draft: true
          name: ${{ github.ref_name }}
          body: |
            ## Hermes Desktop — RU Edition

            Bundled with Russian ecosystem plugins:
            - RouterAI (model-provider + image generation)
            - NeuralDeep (model-provider + web search)
            - MAX Messenger (platform)

            ### Install
            1. Download the `.dmg` or `Hermes.zip`
            2. Open it, drag **Hermes** to Applications
            3. Right-click → Open (adhoc-signed, not notarized — Gatekeeper
               will prompt once, then allow)
            4. First launch installs Hermes Agent + copies RU plugins automatically

            ### Signature
            - **Adhoc** ("Sign to Run Locally", identity `-`)
            - Not notarized — for local development/testing only
            - Verify: `codesign -dv --verbose=4 Hermes.app` → shows `adhoc`

            ### Requirements
            - macOS 12+
            - Internet connection (first launch downloads Hermes Agent core)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
